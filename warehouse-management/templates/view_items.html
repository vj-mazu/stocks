{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <h3 class="fw-bold mb-0"><i class="bi bi-table"></i> All Items</h3>
  <div>
    <input type="text" id="searchInput" class="form-control d-inline-block" style="width:260px;" placeholder="🔍 Search bill, vehicle, shipper..." autocomplete="off">
  </div>
</div>
<div id="itemsTableContainer">
  {% include "_items_table.html" %}
</div>

<script>
  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    const q = this.value.trim();
    searchTimer = setTimeout(() => {
      fetch('/search_items?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(data => {
          document.getElementById('itemsTableContainer').innerHTML = data.html;
        })
        .catch(e => console.error('Search error:', e));
    }, 300);
  });
</script>
{% endblock %}
