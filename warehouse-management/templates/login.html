{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-80 animate__animated animate__fadeIn">
  <div class="col-md-6">
    <div class="card shadow-lg border-0 p-4 animate__animated animate__zoomIn">
      <div class="text-center mb-3">
        <img src="https://images.unsplash.com/photo-1515168833906-d2a3b82b2018?auto=format&fit=facearea&w=400&q=80" class="rounded-circle mb-2" style="width:80px; box-shadow:0 2px 8px #0001;" alt="login image">
        <h2 class="fw-bold mb-2" style="color:#1976d2;">
          <i class="bi bi-person-circle"></i> Login
        </h2>
        <p class="text-secondary mb-2">Welcome back to <b>Warehouse Management</b></p>
      </div>
      <form method="POST" autocomplete="off">
        <div class="mb-3">
          <input type="text" name="username" class="form-control form-control-lg shadow-sm" placeholder="Username" required autofocus>
        </div>
        <div class="mb-3">
          <input type="password" name="password" class="form-control form-control-lg shadow-sm" placeholder="Password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100 ripple" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>
      <div class="mt-3 text-center">
        <span>Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none">Register</a></span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
