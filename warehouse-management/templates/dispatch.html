{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-80 animate__animated animate__fadeIn">
  <div class="col-md-7">
    <div class="card shadow-lg border-0 p-4 animate__animated animate__zoomIn">
      <div class="text-center mb-3">
        <img src="https://images.unsplash.com/photo-1515168833906-d2a3b82b2018?auto=format&fit=facearea&w=400&q=80" class="rounded mb-2" style="width:90px; box-shadow:0 2px 8px #0002;" alt="dispatch image">
        <h2 class="fw-bold mb-2" style="color:#1976d2;">
          <i class="bi bi-truck"></i> Dispatch
        </h2>
        <p class="text-secondary mb-2">Enter dispatch details for a bill</p>
      </div>
      <form method="POST" autocomplete="off">
        <div class="row g-3">
          <div class="col-md-6">
            <input type="text" name="bill_number" class="form-control form-control-lg shadow-sm" placeholder="Bill Number" required>
          </div>
          <div class="col-md-6">
            <input type="text" name="vehicle_number" class="form-control form-control-lg shadow-sm" placeholder="Vehicle Number" required>
          </div>
          <div class="col-md-6">
            <input type="text" name="customer_name" class="form-control form-control-lg shadow-sm" placeholder="Customer Name" required>
          </div>
          <div class="col-md-6">
            <input type="text" name="destination_place" class="form-control form-control-lg shadow-sm" placeholder="Destination Place" required>
          </div>
        </div>
        <button class="btn btn-danger btn-lg mt-4 w-100 ripple" type="submit">
          <i class="bi bi-send"></i> Save Dispatch
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
