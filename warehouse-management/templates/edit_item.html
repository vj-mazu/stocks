{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-lg mt-3">
      <div class="card-header bg-primary text-white fw-bold">
        Edit Item
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="bill_number" class="form-label">Bill Number</label>
            <input type="text" class="form-control" id="bill_number" name="bill_number" value="{{ item.bill_number }}" required>
          </div>
          <div class="mb-3">
            <label for="vehicle_number" class="form-label">Vehicle Number</label>
            <input type="text" class="form-control" id="vehicle_number" name="vehicle_number" value="{{ item.vehicle_number }}" required>
          </div>
          <div class="mb-3">
            <label for="shipper_name" class="form-label">Shipper Name</label>
            <input type="text" class="form-control" id="shipper_name" name="shipper_name" value="{{ item.shipper_name }}" required>
          </div>
          <div class="mb-3">
            <label for="weight" class="form-label">Weight (kg or ton)</label>
            <input type="text" class="form-control" id="weight" name="weight" value="{{ item.weight }}" required>
          </div>
          <div class="mb-3">
            <label for="item_name" class="form-label">Item Name</label>
            <input type="text" class="form-control" id="item_name" name="item_name" value="{{ item.item_name }}" required>
          </div>
          <div class="mb-3">
            <label for="city_from" class="form-label">City From</label>
            <input type="text" class="form-control" id="city_from" name="city_from" value="{{ item.city_from }}" required>
          </div>
          <button type="submit" class="btn btn-success">Update Item</button>
          <a href="{{ url_for('view_items') }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
